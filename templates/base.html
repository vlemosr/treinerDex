{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TrainerDex{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/trainerdex.css' %}?v=20261031-1">
</head>
<body class="{% block body_class %}{% endblock %}">
    <main class="page-shell">
        {% if messages %}
            <section class="messages" aria-label="Mensagens do sistema">
                {% for message in messages %}
                    <p class="message message-{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </section>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
